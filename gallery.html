<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>الصور | همسة للسياحة</title>
<meta name="description" content="صور حقيقية من رحلات ضيوف الرحمن مع همسة للسياحة.">
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="index.html" aria-label="همسة للسياحة"><img src="images/logo-header.webp" width="164" height="120" alt="همسة للسياحة" style="height:60px;display:block;width:auto" onerror="this.remove();this.parentNode.classList.add('logo-missing')"></a>
<nav class="nv" aria-label="التنقل"><a href="index.html">الرئيسية</a><a href="offers.html">العروض</a><a href="hotels.html">الفنادق</a><a href="gallery.html" aria-current="page">الصور</a></nav>
<span class="acts"><button id="adminBtn" type="button" hidden>لوحة التحكم</button> <button id="loginBtn" type="button">تسجيل الدخول</button></span></header>
<div class="ph"><h1>لحظاتنا مع ضيوف الرحمن</h1><p>صور حقيقية من رحلات ضيوفنا مع همسة للسياحة.</p></div>
<main>
<section id="gallery" aria-label="معرض الصور"><div class="tabs" id="gtabs" role="tablist"></div><div class="gg" id="gg"></div></section>
</main>
<footer>همسة للسياحة — ترخيص رقم 2244 فئة (أ) · 37 ش بهاء الدين الغتوري، سيدي جابر، الإسكندرية<br>جميع الحقوق محفوظة ©</footer>
<a class="btn wa" id="wa" target="_blank" rel="noopener">واتساب</a>

<dialog id="glb" aria-label="معرض الصور"><button class="gx" type="button" aria-label="إغلاق">✕</button><button class="gn gp" type="button" aria-label="السابق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><button class="gn gnx" type="button" aria-label="التالي"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><figure><img alt=""><figcaption><b></b><small></small></figcaption></figure></dialog>

<script src="common.js"></script>
<script>ui();
// ===== لحظاتنا مع ضيوف الرحمن =====
// عشان تضيف صورة: حطها في images/gallery وضيف سطر هنا. التابات الفاضية بتختفي لوحدها.
const GCATS = { umra: 'في رحاب الحرمين', hajj: 'صور الحج', qora: 'مبادرة تيسير العمرة' };
// r = نسبة عرض/ارتفاع الصورة لو مش أفقية 4/3 (مثلاً بوستر طولي '4/5' أو صورة طولية '2/3'). التاب اللي فيه نسب مختلفة بيتعرض متراصّ تلقائي.
const GPH = [
  { c: 'umra', f: 'umra-1', t: 'أمام الكعبة المشرفة' },
  { c: 'umra', f: 'umra-2', t: 'رحلة المدينة المنورة' },
  { c: 'umra', f: 'umra-3', t: 'رحلة المدينة المنورة' },
  { c: 'umra', f: 'umra-4', t: 'من زيارات المدينة المنورة' },
  { c: 'umra', f: 'umra-5', t: 'داخل المسجد الحرام' },
  { c: 'umra', f: 'umra-6', t: 'لحظة الانطلاق' },
  { c: 'qora', f: 'qora-1', t: 'مبروك عمرة التيسير' },
  { c: 'qora', f: 'init-1', t: 'مبادرة تيسير العمرة', q: 1, r: '4/5' },
  { c: 'qora', f: 'qora-2', t: 'حضور سحب قرعة التيسير' },
  { c: 'qora', f: 'init-2', t: 'مبادرة تيسير العمرة', q: 1, r: '4/5' },
  { c: 'qora', f: 'qora-3', t: 'فرحة الحضور' },
  { c: 'qora', f: 'init-3', t: 'مبادرة تيسير العمرة', q: 1, r: '4/5' },
  { c: 'qora', f: 'qora-4', t: 'لحظات الفرح بعد الإعلان', r: '2/3' },
  { c: 'qora', f: 'init-4', t: 'مبادرة تيسير العمرة', q: 1, r: '4/5' },
  { c: 'qora', f: 'qora-5', t: 'دموع الفرح', r: '2/3' }
];
(() => {
  const $ = s => document.querySelector(s), cats = Object.keys(GCATS).filter(k => GPH.some(p => p.c === k));
  if (!cats.length) { $('#gg').innerHTML = '<p class="empty">الصور هتتضاف قريب.</p>'; return; }
  let cur = cats[0], list = [], idx = 0;
  const e = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function show() {
    list = GPH.filter(p => p.c === cur);
    $('#gg').className = 'gg' + (list.some(p => p.r) ? ' mas' : '');
    $('#gg').innerHTML = list.map((p, i) => `<a class="gi" href="images/gallery/${p.f}.webp" data-i="${i}" style="aspect-ratio:${p.r || '4/3'}"><img loading="lazy" decoding="async" width="640" height="480" alt="${e(p.t)}" src="images/gallery/${p.f}-t.webp" onerror="this.remove();this.parentNode.classList.add('no-image')"${p.p ? ` style="object-position:${p.p}"` : ''}>${p.q ? '' : `<span>${e(p.t)}</span>`}</a>`).join('');
  }
  function tabs() {
    $('#gtabs').hidden = cats.length < 2;
    $('#gtabs').innerHTML = cats.map(k => `<button type="button" role="tab" data-g="${k}" class="${k === cur ? 'on' : ''}" aria-selected="${k === cur}">${GCATS[k]}</button>`).join('');
  }
  $('#gtabs').onclick = ev => { const k = ev.target.dataset.g; if (!k) return; cur = k; tabs(); show(); };
  const dlg = $('#glb'), im = dlg.querySelector('img');
  function open(i) {
    idx = (i + list.length) % list.length; const p = list[idx];
    im.style.opacity = 0; im.onload = im.onerror = () => { im.style.opacity = 1; };
    im.src = 'images/gallery/' + p.f + '.webp'; im.alt = p.t;
    dlg.querySelector('figcaption b').textContent = p.t;
    dlg.querySelector('figcaption small').textContent = (idx + 1) + ' من ' + list.length;
    if (!dlg.open) dlg.showModal();
    const n = list[(idx + 1) % list.length]; new Image().src = 'images/gallery/' + n.f + '.webp';
  }
  $('#gg').onclick = ev => { const a = ev.target.closest('.gi'); if (!a) return; ev.preventDefault(); open(+a.dataset.i); };
  dlg.querySelector('.gx').onclick = () => dlg.close();
  dlg.querySelector('.gp').onclick = () => open(idx - 1);
  dlg.querySelector('.gnx').onclick = () => open(idx + 1);
  dlg.addEventListener('click', ev => { if (ev.target === dlg || ev.target.tagName === 'FIGURE') dlg.close(); });
  dlg.addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft') open(idx + 1); else if (ev.key === 'ArrowRight') open(idx - 1); });
  let x0 = null;
  dlg.addEventListener('touchstart', ev => { x0 = ev.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', ev => { if (x0 === null) return; const dx = ev.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) open(dx < 0 ? idx + 1 : idx - 1); });
  tabs(); show();
})();
</script>
</body>
</html>
