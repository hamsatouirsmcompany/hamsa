<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | همسة للسياحة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9fc;--card:#fff;--ink:#0f2433;--mute:#4f6676;--hd:#0b2f47;--g:#0b2f47;--g2:#14587f;--gold:#8a6700;--y:#fac80f;--line:#d3e4ee;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0a1b27;--card:#10293a;--ink:#e6f1f8;--mute:#9ab5c6;--hd:#071d2d;--g:#8cd0f5;--g2:#14587f;--gold:#fac80f;--line:#223f52;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);border-bottom:3px solid var(--y);padding:10px 5vw;display:flex;align-items:center;justify-content:space-between}
header a{color:#fff;text-decoration:none;font-size:.95rem;border:1px solid #fff8;padding:6px 14px;border-radius:8px}
.wrap{flex:1;display:grid;place-items:center;padding:24px 5vw;background:linear-gradient(180deg,#0b2f4714,transparent)}
.box{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px #0b2f4720}
.box img{height:56px;display:block;margin:0 auto 12px}
h1{margin:0 0 4px;font-size:1.5rem;text-align:center}
.sub{margin:0 0 18px;text-align:center;color:var(--mute);font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{background:transparent;color:var(--ink);border:0;padding:8px}
.seg button.on{background:var(--hd);color:var(--y)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.92rem;color:var(--mute)}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.pw{position:relative}.pw input{padding-inline-end:64px}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);padding:4px 10px;font-size:.82rem;background:transparent;color:var(--g);border:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--g2);background:var(--g2);color:#fff;padding:10px 16px}
button[type=submit]{width:100%;font-weight:700;background:var(--y);border-color:var(--y);color:#0b2f47}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{padding:10px;border-radius:8px;background:#b3261e22;color:var(--err);font-size:.92rem}
.note{margin-top:14px;font-size:.85rem;color:var(--mute);text-align:center}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<header><span style="color:#fff;font-weight:700">همسة للسياحة</span><a href="index.html">← الرجوع للعروض</a></header>
<div class="wrap">
<div class="box">
  <img src="images/logo.png" alt="همسة للسياحة" onerror="this.remove()">
  <h1 id="title">تسجيل الدخول</h1>
  <p class="sub" id="sub">للمدير والموظفين والزوار</p>
  <div class="seg" role="tablist">
    <button type="button" id="tLogin" class="on" role="tab">دخول</button>
    <button type="button" id="tReg" role="tab">حساب جديد (زائر)</button>
  </div>
  <form id="f" novalidate>
    <label id="nameL" hidden>الاسم<input name="name" autocomplete="name" maxlength="60"></label>
    <label><span id="uLbl">اسم المستخدم أو الإيميل</span><input name="u" required autocomplete="username" dir="ltr" style="text-align:start"></label>
    <label>كلمة السر<span class="pw"><input name="p" id="p" type="password" required autocomplete="current-password" dir="ltr" style="text-align:start"><button type="button" id="eye">إظهار</button></span></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="err" class="msg" role="alert" hidden></div>
    <button type="submit" id="go">دخول</button>
  </form>
  <p class="note" id="note">المدير والموظفين يدخلوا لوحة التحكم. الزائر يشوف العروض ويحجز.</p>
</div>
</div>
<script>
// نفس رابط Apps Script اللي في index.html
const API = 'https://script.google.com/macros/s/AKfycbxRr2PYw2kkY9TiAGVT0MfswIBsxYPtrVuRBvXjzrOTVdr7ueGHOSLjHkUEZkshPmEOFg/exec';
const $ = s => document.querySelector(s);
let reg = false;

// لو داخل بالفعل، حوّله على طول
try { const m = JSON.parse(sessionStorage.getItem('me') || 'null'); if (m && sessionStorage.getItem('t')) location.replace(m.role === 'visitor' ? 'index.html' : 'index.html#admin'); } catch (e) {}

function mode(r) {
  reg = r;
  $('#tLogin').classList.toggle('on', !r); $('#tReg').classList.toggle('on', r);
  $('#nameL').hidden = !r; $('#nameL input').required = r;
  $('#title').textContent = r ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
  $('#uLbl').textContent = r ? 'الإيميل' : 'اسم المستخدم أو الإيميل';
  $('#p').autocomplete = r ? 'new-password' : 'current-password';
  $('#go').textContent = r ? 'إنشاء الحساب' : 'دخول';
  $('#note').textContent = r ? 'الحساب الجديد للزوار فقط: تشوف العروض وتحجز وتحفظ المفضلة. كلمة السر 8 حروف أو أكتر.' : 'المدير والموظفين يدخلوا لوحة التحكم. الزائر يشوف العروض ويحجز.';
  $('#err').hidden = true;
}
$('#tLogin').onclick = () => mode(false);
$('#tReg').onclick = () => mode(true);
$('#eye').onclick = () => { const p = $('#p'), s = p.type === 'password'; p.type = s ? 'text' : 'password'; $('#eye').textContent = s ? 'إخفاء' : 'إظهار'; };

async function call(action, data) {
  const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, ...data }) })).json();
  if (r.error) throw new Error(r.error);
  return r;
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), err = $('#err'), go = $('#go');
  if (f.website) return; // روبوت
  err.hidden = true; go.disabled = true;
  try {
    if (reg) await call('register', { name: f.name, email: f.u, password: f.p });
    const r = await call('login', { u: f.u, p: f.p });
    sessionStorage.setItem('t', r.token);
    sessionStorage.setItem('me', JSON.stringify({ name: r.name, role: r.role }));
    location.replace(r.role === 'visitor' ? 'index.html' : 'index.html#admin');
  } catch (x) {
    err.hidden = false;
    err.textContent = /fetch|NetworkError|JSON|Failed/i.test(x.message) ? 'مشكلة في الاتصال. جرّب تاني.' : x.message;
    go.disabled = false;
  }
};
</script>
</body>
</html>
