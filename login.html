<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>تسجيل الدخول | همسة للسياحة</title>
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#1a2540;--mute:#5d667c;--hd:#14295f;--g:#24448f;--g2:#24448f;--gold:#8a6700;--y:#f5c50f;--line:#f0e3b3;--tint:#fff8dc;--err:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;font:16px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);border-bottom:3px solid var(--y);padding:10px max(5vw,env(safe-area-inset-right)) 10px max(5vw,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
header a{color:#fff;text-decoration:none;font-size:.95rem;border:1px solid #fff8;padding:8px 14px;border-radius:8px;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
header a:hover{background:#ffffff1f}
.wrap{flex:1;display:grid;place-items:center;padding:24px max(5vw,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(5vw,env(safe-area-inset-left));background:linear-gradient(180deg,#14295f14,transparent)}
.box{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px #14295f20}
.box img{height:78px;max-width:100%;width:auto;object-fit:contain;display:block;margin:0 auto 14px;background:#fff;border-radius:14px;padding:6px 16px}
h1{margin:0 0 4px;font-size:1.5rem;text-align:center}
.sub{margin:0 0 18px;text-align:center;color:var(--mute);font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{background:transparent;color:var(--ink);border:0;padding:8px;min-height:44px}
.seg button.on{background:var(--hd);color:var(--y)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.92rem;color:var(--mute)}
input{font:inherit;font-size:16px;padding:10px 12px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.pw{position:relative;display:block}.pw input{padding-inline-end:76px}
.pw button{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);padding:4px 10px;min-height:38px;font-size:.85rem;background:transparent;color:var(--g);border:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--g2);background:var(--g2);color:#fff;padding:10px 16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button[type=submit]{width:100%;min-height:48px;font-weight:700;background:var(--y);border-color:var(--y);color:#14295f}
@media(hover:hover){button[type=submit]:hover:not(:disabled){filter:brightness(1.07)}.seg button:not(.on):hover{background:#24448f1f}}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{padding:10px;border-radius:8px;background:#b3261e22;color:var(--err);font-size:.92rem}
.note{margin-top:14px;font-size:.85rem;color:var(--mute);text-align:center}
.hp{position:absolute;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* موبايل */
@media(max-width:480px){
  .wrap{align-items:start;padding-top:16px}
  .box{padding:20px 16px;border-radius:14px}
  h1{font-size:1.3rem}
  header span{font-size:.95rem}
  header a{font-size:.88rem;padding:8px 10px}
}
/* شاشات قصيرة (موبايل أفقي) */
@media(max-height:520px){.wrap{align-items:start}.box img{height:40px}}
/* شاشات كبيرة */
@media(min-width:900px){.box{padding:36px;width:min(480px,100%)}h1{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header{background:#fff;border-bottom:3px solid var(--y);box-shadow:0 2px 12px #14295f12}
header a{color:var(--g);border:1px solid #d9b84a}
header a:hover{background:var(--tint)}
.wrap{background:linear-gradient(180deg,var(--tint),#fff)}
.box{border-color:var(--line);box-shadow:0 10px 30px #d49b0022}
.box img{background:none;padding:0;border-radius:0;height:88px}
.seg{background:var(--tint)}
.seg button.on{background:var(--y);color:var(--hd);font-weight:700}
button{background:var(--y);border-color:var(--y);color:var(--hd);font-weight:700}
.pw button{background:transparent;border:0;color:var(--g);font-weight:500}
input{border-color:#e6d594}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><span style="color:var(--g);font-weight:700">همسة للسياحة</span><a href="index.html">← الرجوع للعروض</a></header>
<div class="wrap">
<div class="box">
  <img src="images/logo-login.webp" width="245" height="180" alt="همسة للسياحة" onerror="this.remove()">
  <h1 id="title">تسجيل الدخول</h1>
  <p class="sub" id="sub">للمدير والموظفين والزوار</p>
  <div class="seg" role="tablist">
    <button type="button" id="tLogin" class="on" role="tab">دخول</button>
    <button type="button" id="tReg" role="tab">حساب جديد (زائر)</button>
  </div>
  <form id="f" novalidate>
    <label id="nameL" hidden>الاسم<input name="name" autocomplete="name" enterkeyhint="next" maxlength="60"></label>
    <label><span id="uLbl">اسم المستخدم أو الإيميل</span><input name="u" required autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" dir="ltr" style="text-align:start"></label>
    <label>كلمة السر<span class="pw"><input name="p" id="p" type="password" required autocomplete="current-password" autocapitalize="none" enterkeyhint="go" dir="ltr" style="text-align:start"><button type="button" id="eye">إظهار</button></span></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="err" class="msg" role="alert" hidden></div>
    <button type="submit" id="go">دخول</button>
  </form>
  <p class="note" id="note">المدير والموظفين يدخلوا لوحة التحكم. الزائر يشوف العروض ويحجز.</p>
</div>
</div>
<script>
// نفس رابط Apps Script اللي في index.html
const API = 'https://script.google.com/macros/s/AKfycbxRr2PYw2kkY9TiAGVT0MfswIBsxYPtrVuRBvXjzrOTVdr7ueGHOSLjHkUEZkshPmEOFg/exec';
const $ = s => document.querySelector(s);
let reg = false;

// لو داخل بالفعل، حوّله على طول
try { const m = JSON.parse(sessionStorage.getItem('me') || 'null'); if (m && sessionStorage.getItem('t')) location.replace(m.role === 'owner' ? 'index.html#admin' : 'index.html'); } catch (e) {}

function mode(r) {
  reg = r;
  $('#tLogin').classList.toggle('on', !r); $('#tReg').classList.toggle('on', r);
  $('#nameL').hidden = !r; $('#nameL input').required = r;
  $('#title').textContent = r ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
  $('#uLbl').textContent = r ? 'الإيميل' : 'اسم المستخدم أو الإيميل';
  $('#p').autocomplete = r ? 'new-password' : 'current-password';
  $('#go').textContent = r ? 'إنشاء الحساب' : 'دخول';
  $('#note').textContent = r ? 'الحساب الجديد للزوار فقط: تشوف العروض وتحجز وتحفظ المفضلة. كلمة السر 8 حروف أو أكتر.' : 'المدير والموظفين يدخلوا لوحة التحكم. الزائر يشوف العروض ويحجز.';
  $('#err').hidden = true;
}
$('#tLogin').onclick = () => mode(false);
$('#tReg').onclick = () => mode(true);
$('#eye').onclick = () => { const p = $('#p'), s = p.type === 'password'; p.type = s ? 'text' : 'password'; $('#eye').textContent = s ? 'إخفاء' : 'إظهار'; };

async function call(action, data) {
  const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action, ...data }) })).json();
  if (r.error) throw new Error(r.error);
  return r;
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), err = $('#err'), go = $('#go');
  if (f.website) return; // روبوت
  err.hidden = true; go.disabled = true;
  try {
    if (reg) await call('register', { name: f.name, email: f.u, password: f.p });
    const r = await call('login', { u: f.u, p: f.p });
    sessionStorage.setItem('t', r.token);
    sessionStorage.setItem('me', JSON.stringify({ name: r.name, role: r.role }));
    location.replace(r.role === 'owner' ? 'index.html#admin' : 'index.html');
  } catch (x) {
    err.hidden = false;
    err.textContent = /fetch|NetworkError|JSON|Failed/i.test(x.message) ? 'مشكلة في الاتصال. جرّب تاني.' : x.message;
    go.disabled = false;
  }
};
</script>
</body>
</html>
