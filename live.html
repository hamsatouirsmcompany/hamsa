<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>البث المباشر | همسة للسياحة</title>
<meta name="description" content="شاهد البث المباشر من همسة للسياحة.">
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css">
<style>
.lw{max-width:980px;margin:0 auto}
.lb{display:inline-flex;align-items:center;gap:8px;border-radius:50px;padding:2px 14px;font-weight:700;font-size:.9rem;background:var(--tint);color:var(--gold);border:1px solid var(--line)}
.lb.live{background:#b3261e;color:#fff;border-color:#b3261e}.lb.live:before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;animation:lp 1.2s infinite}
@keyframes lp{50%{opacity:.25}}
.lp{aspect-ratio:16/9;background:#0b1738;border-radius:16px;overflow:hidden;border:3px solid var(--y);box-shadow:0 10px 30px #14295f30;display:grid;place-items:center;color:#fff;text-align:center}
.lp iframe{width:100%;height:100%;border:0;display:block}
.lp .ph2{padding:24px;max-width:46ch}.lp .ph2 b{display:block;font-size:1.4rem;color:var(--y);margin-bottom:6px}
.ln{margin-top:12px;padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,#e3ebfa,#fff8d6);border:1px solid var(--line);color:#101b36;font-weight:700;text-align:center;white-space:pre-line}
.lo{text-align:center;margin-top:12px}
.lp{position:relative}
.lp.yt iframe{position:absolute;left:0;top:-64px;width:100%;height:calc(100% + 128px);pointer-events:none}
.lg{position:absolute;top:10px;right:10px;z-index:3;pointer-events:none;background:rgba(11,23,56,.55);border-radius:10px;padding:5px 9px;backdrop-filter:blur(4px)}
.lg img{height:34px;width:auto;display:block}
.sh{position:absolute;left:0;right:0;top:0;height:56px;z-index:2}
.um{position:absolute;bottom:12px;left:12px;z-index:3;border:0;border-radius:20px;padding:8px 14px;background:var(--y);color:#14295f;font:700 .9rem inherit;cursor:pointer}
@media(max-width:600px){.lg img{height:26px}}
@media(prefers-reduced-motion:reduce){.lb.live:before{animation:none}}
</style>
</head>
<body>
<header><a href="index.html" aria-label="همسة للسياحة"><img src="images/logo-header.webp" width="164" height="120" alt="همسة للسياحة" style="height:60px;display:block;width:auto" onerror="this.parentNode.classList.add('logo-missing');this.remove()"></a>
<nav class="nv" aria-label="التنقل"><a href="index.html">الرئيسية</a><a href="offers.html">العروض</a><a href="hotels.html">الفنادق</a><a href="gallery.html">الصور</a><a href="winners.html">الفائزون</a><a href="live.html" aria-current="page">البث المباشر</a></nav>
<span class="acts"><button id="adminBtn" type="button" hidden>لوحة التحكم</button> <button id="loginBtn" type="button">تسجيل الدخول</button></span></header>
<div class="ph"><span class="lb" id="lbd">البث المباشر</span><h1 id="lt">البث المباشر</h1><p id="ls"></p></div>
<main><div class="lw"><div class="lp" id="lp" aria-live="polite"></div><div class="ln" id="ln" hidden></div><div class="lo" id="lo" hidden></div></div></main>
<footer>همسة للسياحة — ترخيص رقم 2244 فئة (أ) · 37 ش بهاء الدين الغتوري، سيدي جابر، الإسكندرية<br>جميع الحقوق محفوظة ©</footer>
<a class="btn wa" id="wa" target="_blank" rel="noopener">واتساب</a>
<script src="common.js"></script>
<script src="live.js"></script>
<script>
ui();
let cur = '';
$('#lp').addEventListener('click', e => {
  const b = e.target.closest('.um'); if (!b) return;
  const f = $('#lp iframe'); if (f) { ['unMute', 'playVideo'].forEach(c => f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: c, args: [] }), '*')); f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [100] }), '*'); }
  b.remove();
});
const ST = { live: 'مباشر الآن', soon: 'قريبًا', ended: 'انتهى البث', off: 'البث المباشر' };
function draw(c) {
  c = c || {}; const st = ST[c.status] ? c.status : 'off', L = liveSrc(c.url), box = $('#lp');
  $('#lt').textContent = c.title || 'البث المباشر'; $('#ls').textContent = c.desc || '';
  $('#lbd').textContent = ST[st]; $('#lbd').className = 'lb' + (st === 'live' ? ' live' : '');
  document.title = (st === 'live' ? '🔴 ' : '') + (c.title || 'البث المباشر') + ' | همسة للسياحة';
  if (st === 'live' && L) {
    if (cur !== L.src) {
      cur = L.src; box.className = 'lp ' + L.k;
      box.innerHTML = `<iframe src="${esc(L.src)}" title="البث المباشر" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>${L.k === 'fb' ? '<div class="sh"></div>' : ''}<span class="lg"><img src="images/logo-live.webp" alt="همسة للسياحة"></span>${L.k === 'yt' ? '<button class="um" type="button">🔊 تشغيل الصوت</button>' : ''}`;
    }
  } else {
    cur = ''; box.className = 'lp';
    const t = { soon: ['البث هيبدأ قريب', c.when ? 'الموعد: ' + c.when : 'خليك معانا وهتلاقي البث هنا أول ما يبدأ.'], ended: ['انتهى البث', 'شكرًا لمتابعتكم. تابعونا في البث الجاي.'] }[st] || ['مفيش بث دلوقتي', 'هنعلن عن موعد البث الجاي هنا.'];
    box.innerHTML = `<div class="ph2"><b>${esc(t[0])}</b>${esc(t[1])}</div>`;
  }
  const n = $('#ln'); n.hidden = !c.note; n.textContent = c.note || '';
}
async function load() {
  try { const j = await (await fetch(API + '?action=live')).json(); if (j && j.live) { draw(j.live); try { localStorage.setItem('hm_live', JSON.stringify(j.live)); } catch (e) {} } } catch (e) {}
}
try { draw(JSON.parse(localStorage.getItem('hm_live') || 'null')); } catch (e) { draw(null); }
load(); setInterval(() => { if (!document.hidden) load(); }, 15000);
</script>
</body>
</html>
